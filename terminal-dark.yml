theme: oxocarbon

window:
  width: 960
  title: "iamkz@github: ~"
  style: macos
  borderRadius: 16
  autoHeight: true
  maxHeight: 330

terminal:
  prompt: "iamkz@github:~$ "
  fontSize: 18
  padding: 28

effects:
  shadow: true
  scanlines: false
  textGlow: false
  vignette: false

animation:
  loop: true
  defaultTypingDuration: 0.8
  commandOutputPause: 0.35
  outputEndPause: 1
  defaultSequencePause: 2

blocks:
  - block: motd
    config:
      title: "IAMKZ"
      subtitle: "Open Source · Developer Tools · Automation"

  - block: custom
    config:
      command: "cat ./currently-building"
      lines:
        - "[[fg:cyan]]Practical tools for systems, workflows and everyday problems.[[/fg]]"

  - block: custom
    config:
      command: "./build.sh"
      lines:
        - "[[fg:green]]✓ profile ready[[/fg]]"
        - "[[dim]]systems · tooling · automation[[/dim]]"
