theme: oxocarbon

window:
  width: 960
  title: "iamkz@github: ~"
  style: macos
  borderRadius: 16
  autoHeight: true
  maxHeight: 360

terminal:
  prompt: "iamkz@github:~$ "
  fontSize: 18
  padding: 28

effects:
  shadow: true
  scanlines: false
  textGlow: false
  vignette: false

animation:
  loop: true
  defaultTypingDuration: 0.75
  commandOutputPause: 0.35
  outputEndPause: 0.9
  defaultSequencePause: 1.6

blocks:
  - block: motd
    config:
      title: "IAMKZ"
      subtitle: "Open Source · Developer Tools · Automation"

  - block: custom
    config:
      command: "whoami"
      lines:
        - "[[fg:cyan]]iamkz[[/fg]]"
        - "[[dim]]An open-source developer building useful tools for real-world workflows.[[/dim]]"

  - block: custom
    config:
      command: "ls ./focus"
      lines:
        - "[[fg:green]]developer-tools[[/fg]]"
        - "[[fg:green]]backend-systems[[/fg]]"
        - "[[fg:green]]automation[[/fg]]"

  - block: custom
    config:
      command: "cat ./currently-building"
      lines:
        - "[[fg:yellow]]Practical tools, scripts and small experiments that solve everyday problems.[[/fg]]"

  - block: custom
    config:
      command: "cat ./stack"
      lines:
        - "[[fg:magenta]]Python · Java · TypeScript · C · PostgreSQL · Vue · Docker[[/fg]]"

  - block: custom
    config:
      command: "echo $LOCATION"
      lines:
        - "[[fg:blue]]Chengdu, China[[/fg]]"

  - block: custom
    config:
      command: "./status"
      lines:
        - "[[fg:green]]✓ shipping useful software, one experiment at a time[[/fg]]"
