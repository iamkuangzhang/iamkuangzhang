name: Generate Profile Header

on:
  workflow_dispatch:

  push:
    paths:
      - "terminal-dark.yml"
      - "terminal-light.yml"
      - ".github/workflows/profile-header.yml"

permissions:
  contents: write

# 防止多个生成任务同时向 main 推送
concurrency:
  group: profile-header-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Create assets directory
        run: mkdir -p assets

      - name: Generate dark header
        uses: williamzujkowski/svg-terminal@v1
        with:
          config: terminal-dark.yml
          output: assets/profile-header-dark.svg
          minify: true

      - name: Generate light header
        uses: williamzujkowski/svg-terminal@v1
        with:
          config: terminal-light.yml
          output: assets/profile-header-light.svg
          minify: true

      - name: Commit and push generated headers
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assets/profile-header-dark.svg \
            assets/profile-header-light.svg

          if git diff --cached --quiet; then
            echo "Profile headers are already up to date."
            exit 0
          fi

          git commit -m "chore: update generated profile headers"

          # main 可能在生成过程中发生变化，先同步再推送
          git pull --rebase origin main
          git push origin HEAD:main
